spring.application.name=muzify
server.port=8080

# По умолчанию - встроенная БД H2 (ничего устанавливать не нужно)
spring.datasource.url=jdbc:h2:mem:muzify;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (секрет минимум 32 символа)
app.jwt.secret=muzify-super-secret-key-change-me-0123456789
app.jwt.expiration-ms=86400000

# Хранилище аудиофайлов и ограничения загрузки
app.storage.dir=./uploads
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Папка с вашими аудиофайлами - подхватываются при старте
app.music.dir=./music
